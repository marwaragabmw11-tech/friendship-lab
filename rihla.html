<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رحلتي إلى معرفة نفسي وفهم الحياة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#f7c6d6;--pink-d:#e88aa7;--lav:#e6dcfb;--lav-d:#8b6cc4;--mint:#ccf1e1;--mint-d:#3fa37c;--gold:#f2c46d;--gold-d:#c9952f;
--ink:#3d2f45;--soft:#7c6c84;--card:#fffdfd;--line:#efe3f0;--sh:0 8px 24px rgba(120,80,140,.12);--bad:#fde4e6;--ok:#fff3d6;--good:#dff5ea}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Tajawal',sans-serif;color:var(--ink);font-size:17px;line-height:1.75;min-height:100vh;
 background:linear-gradient(180deg,#fff6fa 0%,#f6f0ff 45%,#effaf5 100%) fixed}
h1,h2,h3,h4{font-family:'El Messiri','Tajawal',sans-serif;margin:0;line-height:1.35}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 60px}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(255,250,253,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px}
.ib{border:2px solid var(--line);background:#fff;border-radius:14px;min-width:40px;height:40px;font-size:19px;display:grid;place-items:center;padding:0 8px}
.lvl{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.lvl .badge{font-size:24px}
.lvl .info{flex:1;min-width:0}
.lvl .name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:9px;background:#f1e6f4;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pink-d));border-radius:9px;transition:width .6s}
.xp{font-size:12px;color:var(--soft);font-weight:700}
/* mascot */
.guide{display:flex;align-items:flex-end;gap:10px;margin:18px 0 6px}
.sana{flex:0 0 auto;width:92px;height:92px;animation:float 3.2s ease-in-out infinite}
.sana.sm{width:58px;height:58px}
@keyframes float{50%{transform:translateY(-6px)}}
.sana .eye{animation:blink 4.5s infinite;transform-origin:center 50%;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:22px 22px 22px 6px;padding:12px 16px;box-shadow:var(--sh);flex:1;font-weight:600}
.bubble b.nm{color:var(--lav-d);display:block;font-size:13px;margin-bottom:2px}
/* hero */
.hero{text-align:center;padding:18px 0 4px}
.hero h1{font-size:clamp(24px,6vw,36px);color:#6a3f86}
.quote{margin:10px auto 0;max-width:620px;background:linear-gradient(135deg,#fff,#fff5e0);border:2px dashed var(--gold);border-radius:18px;padding:10px 14px;font-weight:700}
.today{display:flex;align-items:center;gap:12px;margin:16px 0;background:linear-gradient(135deg,#fff3d6,#ffe8f0);border:2px solid var(--gold);border-radius:20px;padding:12px 14px;text-decoration:none;box-shadow:var(--sh)}
.today .e{font-size:34px}
.today b{display:block;font-family:'El Messiri';font-size:17px}
.today small{color:var(--soft);font-weight:700}
/* chests */
.chests{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:10px}
.chest{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 10px 14px;text-align:center;text-decoration:none;box-shadow:var(--sh);transition:transform .2s;display:block}
.chest:active{transform:scale(.97)}
.chest svg{width:96px;height:80px;display:block;margin:0 auto}
.chest h3{font-size:16px;margin-top:6px}
.chest .pr{font-size:13px;color:var(--soft);font-weight:700}
.chest .mini{height:6px;background:#f1e6f4;border-radius:6px;margin:6px 10px 0;overflow:hidden}
.chest .mini i{display:block;height:100%;border-radius:6px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:18px}
.tool{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;text-decoration:none;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:var(--sh)}
.tool span{font-size:24px}
/* box page */
.box-head{display:flex;align-items:center;gap:12px;margin:16px 0 4px}
.box-head svg{width:76px;height:64px;flex:0 0 auto}
.box-head h2{font-size:24px}
.open svg .lid{animation:lid .9s ease-out forwards;transform-origin:20% 60%;transform-box:fill-box}
@keyframes lid{to{transform:rotate(-28deg) translateY(-6px)}}
.open svg .glow{animation:glow 1.2s ease-out forwards}
@keyframes glow{from{opacity:0}to{opacity:1}}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin-top:14px}
.num{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;box-shadow:0 3px 8px rgba(120,80,140,.08);animation:pop .4s backwards}
.num.done{background:var(--good);border-color:#9fd9bd;color:#2e7a58}
.num.seen{background:#fff7e3;border-color:#f0d593}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.rowbtn{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:2px solid var(--line);background:#fff;border-radius:16px;padding:9px 14px;font-weight:800;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.main{background:linear-gradient(135deg,#b78be0,#e88aa7);color:#fff;border:none;box-shadow:0 6px 16px rgba(183,139,224,.4)}
.btn.gold{background:linear-gradient(135deg,#f6d27c,#f2b84b);border:none}
.btn.mint{background:var(--mint);border-color:#9fd9bd}
.legend{font-size:13px;color:var(--soft);margin-top:8px}
/* card */
.mode{display:flex;gap:6px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:4px;margin:12px 0}
.mode button{flex:1;border:none;background:none;border-radius:12px;padding:8px;font-weight:800}
.mode button.on{background:var(--lav);color:#4b2e70}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;box-shadow:var(--sh);overflow:hidden;animation:flip .6s ease-out}
@keyframes flip{from{transform:rotateY(70deg) scale(.9);opacity:0}}
.card-top{padding:18px 18px 14px;text-align:center}
.card-top .e{font-size:54px;line-height:1}
.card-top h2{font-size:25px;margin-top:6px}
.card-top .tag{display:inline-block;margin-top:6px;font-size:13px;font-weight:800;border-radius:999px;padding:2px 12px}
.sec{padding:12px 18px;border-top:1px dashed var(--line)}
.sec h4{font-size:16px;color:#6a3f86;margin-bottom:4px}
.sec p{margin:0}
.opt{display:block;width:100%;text-align:start;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px;margin:7px 0;font-weight:700;font-size:16px}
.opt.best{background:var(--good);border-color:#8fd3b3}
.opt.ok{background:var(--ok);border-color:#f0d593}
.opt.no{background:var(--bad);border-color:#f2a9b3}
.res{font-size:15px;margin-top:4px;font-weight:600}
.islam{background:linear-gradient(135deg,#f7f1ff,#fff8ea);border:2px solid #e3d3f7;border-radius:18px;padding:12px 14px}
.islam .kind{font-size:12px;font-weight:800;color:#fff;background:var(--lav-d);border-radius:999px;padding:1px 10px;display:inline-block}
.islam .txt{font-family:'Amiri',serif;font-size:21px;line-height:1.9;margin:6px 0;color:#3f2a55}
.islam .ref{font-size:13px;font-weight:800;color:var(--gold-d)}
.src{font-size:13px;color:var(--soft);background:#fafafa;border-radius:12px;padding:8px 10px}
.mem{margin:14px 18px 18px;text-align:center;background:linear-gradient(135deg,#ffe9f1,#fff3d6);border:2px solid var(--pink);border-radius:18px;padding:12px;font-family:'El Messiri';font-size:19px;font-weight:700;color:#7a3a5e}
.chk{display:flex;gap:8px;align-items:center;font-weight:800;margin-top:8px}
.chk input{width:22px;height:22px;accent-color:var(--mint-d)}
.finish{padding:0 18px 18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding:6px 0 10px}
.msg{display:flex;gap:8px;align-items:flex-end;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.msg .sana{animation:none}
.msg .b{background:#fff;border:2px solid var(--line);border-radius:20px 20px 20px 6px;padding:10px 14px;box-shadow:var(--sh);max-width:86%;font-weight:600}
.msg.me{justify-content:flex-start;flex-direction:row-reverse}
.msg.me .b{background:var(--lav);border-color:#d6c5f5;border-radius:20px 20px 6px 20px;font-weight:800}
.msg .b .islam{margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:4px 0 6px}
.chip{border:2px solid #d6c5f5;background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;animation:rise .3s}
.chip.opt2{border-radius:16px;text-align:start;max-width:100%}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#c8b6e8;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-5px)}}
/* lists */
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--sh);margin-top:14px}
.feelgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.fe{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 4px;font-weight:800;font-size:13px;text-align:center}
.fe span{display:block;font-size:28px}
.fe.on{background:var(--lav);border-color:var(--lav-d)}
.lvls{display:flex;gap:6px}
.lvls button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 0;font-weight:800}
.lvls button.on{background:var(--pink);border-color:var(--pink-d)}
textarea,input[type=password],input[type=text]{width:100%;font-family:inherit;font-size:16px;border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
label.l{display:block;font-weight:800;margin:14px 0 6px}
.entry{border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin-top:10px;background:#fff}
.entry .h{display:flex;align-items:center;gap:8px}
.entry .h span{font-size:28px}
.entry small{color:var(--soft)}
.entry p{margin:6px 0 0;white-space:pre-wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.bd{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.bd span{font-size:36px;display:block}
.bd b{font-size:13px;display:block;line-height:1.4}
.bd small{font-size:11px;color:var(--soft);display:block}
.bd.off{opacity:.35;filter:grayscale(1)}
.rev{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:#fff;border:2px solid var(--line);margin-top:6px;text-decoration:none;font-weight:700}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140px);background:#4b2e70;color:#fff;border-radius:999px;padding:9px 18px;font-weight:800;z-index:60;transition:transform .35s;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:55}
.small{font-size:14px;color:var(--soft)}
.center{text-align:center}
hr.s{border:none;border-top:1px dashed var(--line);margin:14px 0}
</style>
</head>
<body>
<header class="top"><div class="top-in">
 <a class="ib" href="#home" aria-label="الرئيسية">🏠</a>
 <div class="lvl" id="lvl"></div>
 <button class="ib" id="snd" aria-label="الصوت" onclick="toggleSound()">🔊</button>
 <a class="ib" href="#settings" aria-label="الإعدادات">⚙️</a>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<script>
var BOXES=[];
function ADD(id,a){var b=BOXES.find(function(x){return x.id===id;});b.cards.push.apply(b.cards,a);}
/* صندوق المشاعر — كل بطاقة: t عنوان، e رمز، ex شرح (ما هو ولماذا)، sec أقسام إضافية، story قصة، life مثال من حياتك،
   q سؤال، o اختيارات [نص، best|ok|no، النتيجة]، i [نوع، نص، مرجع، شرح]، act تطبيق، mem عبارة */
BOXES.push({
id:'feel', name:'صندوق المشاعر', e:'💗', color:'#f7b6cb',
desc:'كل المشاعر طبيعية، والشعور ليس ذنبًا. نحن فقط مسؤولون عمّا نفعله بمشاعرنا.',
cards:[
{t:'الفرح',e:'😊',
 ex:'الفرح شعور جميل بالسعادة يأتي عندما يحدث شيء نحبه، أو ننجح، أو نكون مع من نحب. يخبرنا الفرح بالأشياء المهمة لنا.',
 sec:[['كيف أعرفه؟','أبتسم بسهولة، وأشعر بالخفة والنشاط، وأحب أن أشارك الآخرين.'],['في جسمي','وجه مبتسم، طاقة في الجسم، تنفّس مريح، ورغبة في القفز أو الضحك.'],['التصرف الصحي','أشكر الله، وأشارك فرحتي، وأنتبه لمشاعر من حولي حتى لا أؤذي أحدًا حزينًا.'],['الشعور والتصرف','الفرح جميل، لكن السخرية من خاسر أو الصراخ في مكان هادئ تصرّف يحتاج انتباهًا.']],
 story:'نجحت سلمى في حفظ سورة جديدة. فرحت كثيرًا، وأسرعت تخبر جدتها، ثم لاحظت أن أختها حزينة لأنها لم تحفظ بعد، فعرضت أن تساعدها.',
 life:'عندما تحصلين على درجة جيدة، أو تلعبين لعبتك المفضلة، أو يزوركم من تحبين.',
 q:'فزتِ في مسابقة، وصديقتك لم تفز وتبدو حزينة. ماذا تفعلين؟',
 o:[['أقفز وأقول بصوت عالٍ: أنا الأفضل!','no','فرحك مفهوم، لكن هذه الطريقة قد تجرح صديقتك.'],['أفرح بهدوء، وأقول لها كلمة لطيفة عن محاولتها','best','تفرحين وتراعين قلبها في الوقت نفسه. هذا هو الفرح الناضج.'],['أخفي فرحتي تمامًا وكأنني لم أفز','ok','لطيف أنك تفكرين فيها، لكن من حقك أن تفرحي بنجاحك.']],
 i:['آية','قل بفضل الله وبرحمته فبذلك فليفرحوا هو خير مما يجمعون','سورة يونس: 58','الإسلام يحب الفرح بنعم الله، ونتذكر أن كل خير هو من فضل الله.'],
 act:'اكتبي ثلاثة أشياء أفرحتكِ هذا الأسبوع، وقولي «الحمد لله» عن كل واحد منها.',
 mem:'فرحتي تكبر عندما أشاركها، وتجمل عندما أراعي غيري.'},

{t:'الحزن',e:'😢',
 ex:'الحزن شعور طبيعي يأتي عندما نفقد شيئًا نحبه، أو يحدث شيء لم نتمنَّه. الحزن يخبرنا أن شيئًا مهمًا تأثرنا به.',
 sec:[['كيف أعرفه؟','لا أرغب في اللعب، أشعر بثقل، وقد أرغب في البكاء أو البقاء وحدي.'],['في جسمي','دموع، غصة في الحلق، تعب، وضيق في الصدر.'],['التصرف الصحي','أسمح لنفسي بالبكاء، وأحكي لمن أثق به، وأدعو الله، وأفعل شيئًا لطيفًا لنفسي.'],['الشعور والتصرف','البكاء ليس ضعفًا. لكن أن أؤذي نفسي أو غيري بسبب حزني تصرف غير صحي.']],
 story:'مات عصفور ريم الصغير. بكت كثيرًا، فجلست أمها بجانبها وقالت: «حزنك يعني أنك أحببته». رسمت ريم صورة للعصفور، وشعرت بشيء من الراحة.',
 life:'عندما تنتقل صديقتك إلى مدرسة أخرى، أو تضيع لعبتك المفضلة.',
 q:'تشعرين بالحزن لأن صديقتك المقربة سافرت. ما أفضل تصرف؟',
 o:[['أخفي حزني وأقول: أنا بخير','ok','قد لا تريدين الحديث الآن، لكن كتمان الحزن طويلًا يجعله أثقل.'],['أحكي لماما عن شعوري، وأكتب رسالة لصديقتي','best','الحديث يخفف الحزن، والرسالة تبقيكما على تواصل.'],['أغضب من الجميع طوال اليوم','no','الحزن مفهوم، لكن الآخرين لا ذنب لهم.']],
 i:['حديث','إن العين تدمع، والقلب يحزن، ولا نقول إلا ما يرضى ربنا، وإنا بفراقك يا إبراهيم لمحزونون','رواه البخاري','قالها النبي ﷺ عند وفاة ابنه إبراهيم. حتى النبي ﷺ حزن وبكى، فالحزن ليس عيبًا، والمهم أن نقول كلامًا طيبًا يرضي الله.'],
 act:'عندما تحزنين، جرّبي «صندوق الراحة»: حضن، رسم، دعاء، أو كوب ماء دافئ.',
 mem:'حزني يعني أنني أحببت، ومن حقي أن أبكي وأطلب حضنًا.'},

{t:'الغضب',e:'😠',
 ex:'الغضب شعور قوي يأتي عندما نشعر بالظلم، أو يُؤخذ حقنا، أو لا تسير الأمور كما نريد. الغضب يخبرنا أن شيئًا يحتاج إلى حل.',
 sec:[['كيف أعرفه؟','أريد أن أصرخ أو أضرب أو أرمي شيئًا، وأفكاري تصبح سريعة.'],['في جسمي','وجه ساخن، قلب سريع، يدان مقبوضتان، وأسنان مضغوطة.'],['التصرف الصحي','أتوقف، أتنفس ببطء، أستعيذ بالله، أغيّر وضعي أو مكاني، ثم أتكلم بهدوء عمّا أزعجني.'],['الشعور والتصرف','الغضب شعور مسموح، لكن الضرب والشتم والكسر تصرفات غير مسموحة.']],
 story:'أخذ أخو يوسف قلمه دون إذن. شعر يوسف بالغضب وكاد يصرخ، لكنه أخذ ثلاثة أنفاس وقال: «أنا غاضب لأنك أخذت قلمي. من فضلك استأذن أولًا».',
 life:'عندما يقاطعك أحد، أو تخسرين في لعبة، أو يُتهم شخص بشيء لم يفعله.',
 q:'دفعتك زميلة في الطابور وأنتِ غاضبة جدًا. ماذا تفعلين؟',

<script>

const dayNum=()=>Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/864e5);
function weekKey(){const d=new Date();const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-W'+Math.ceil(((t-y)/864e5+1)/7);}
const box=id=>BOXES.find(b=>b.id===id);

/* ================= sounds (WebAudio, no files) ================= */
let AC=null;
function tone(freqs,dur=.12,type='sine',gap=.08,vol=.06){
 if(!S.sound)return;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;
  freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
   g.gain.setValueAtTime(0,t0+i*gap);g.gain.linearRampToValueAtTime(vol,t0+i*gap+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+i*gap+dur+.25);

let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2300);}
function confetti(){const c=document.createElement('canvas');c.className='confetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d');
 const P=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,r:4+Math.random()*5,c:['#f7c6d6','#e88aa7','#b78be0','#f2c46d','#8fd3b3'][Math.floor(Math.random()*5)],v:2+Math.random()*3,w:Math.random()*6}));
 let f=0;(function run(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((f+p.w)/10);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6);});f++;if(f<160)requestAnimationFrame(run);else c.remove();})();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function orderOf(b){let o=S.order[b.id];if(!o||o.length!==b.cards.length){o=shuffle(b.cards.map((_,i)=>i));S.order[b.id]=o;save();}return o;}

/* ---- chat mode with سَنا ---- */
let CH=null;
const PRAISE=['رائع! 🌟','أحسنتِ يا بطلة! 💜','اختيار ذكي جدًا! ✨','تفكير جميل! 🌸'];
const GENTLE=['فكرة مفهومة، لكن انظري معي 🤔','قريبة! دعينا نفكر قليلًا 💭'];
const REDIRECT=['هممم، دعينا نفكر بطريقة أخرى 💭','سؤال صعب، وأنا أفهم لماذا اخترتِه، لكن انظري 🌱'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function chatCard(b,c,ci){
 const k=ck(b.id,ci);
 const steps=[];
 const opener=b.id==='fig'?`اليوم سأحكي لكِ عن شخصية عظيمة: <b>${esc(c.t)}</b> ${c.e}`:b.challenge?`عندي لكِ تحدٍّ ممتع: <b>${esc(c.t)}</b> ${c.e}`:`تعالي نتعرف اليوم على: <b>${esc(c.t)}</b> ${c.e}`;
 steps.push({s:opener,mood:'happy',r:['هيا يا سَنا! ✨','أنا متحمسة! 🤩']});
 steps.push({s:esc(c.ex),mood:'happy',r:['فهمت 👍','أكملي ←']});
 (c.sec||[]).forEach(s=>steps.push({s:`<b>${esc(s[0])}:</b> ${esc(s[1])}`,mood:'think',r:['أكملي ←','مثير! 😮']}));
 if(c.steps)steps.push({s:`🎯 <b>تحديك:</b> ${esc(c.steps)}`,mood:'proud',r:['سأحاول! 💪']});
 if(c.story)steps.push({s:`دعيني أحكي لكِ حكاية صغيرة 📖<br>${esc(c.story)}`,mood:'happy',r:['حكاية جميلة! 🌸','وماذا بعد؟']});
 if(c.life)steps.push({s:`وفي حياتك أنتِ... ${esc(c.life)}<br>هل حدث لكِ شيء مثل هذا؟`,mood:'think',r:['نعم، حدث لي','ليس بعد'],react:{'نعم، حدث لي':'شكرًا لأنكِ شاركتِني 💜 يمكنكِ أن تكتبي عنه في دفترك لاحقًا.','ليس بعد':'جميل! الآن ستعرفين ماذا تفعلين إن حدث 🌱'}});
 if(c.q)steps.push({q:true});
 if(c.i)steps.push({s:`والآن أريكِ كنزًا من الإسلام 🕌`+islamHTML(c.i),mood:'proud',r:['سبحان الله 🤲','جميل! 💜']});
 if(c.src)steps.push({s:`<span class="small">📜 مصدر المعلومات: ${esc(c.src)}</span>`,mood:'think',r:['أكملي ←']});
 if(c.act)steps.push({s:`✋ <b>تطبيق عملي لكِ:</b> ${esc(c.act)}`,mood:'happy',r:['سأجرّبه ✓','لاحقًا إن شاء الله'],react:{'سأجرّبه ✓':'رائع! عندما تجربينه علّمي عليه في البطاقة الكاملة لتحصلي على نقاط ✨','لاحقًا إن شاء الله':'لا بأس، سأذكّرك عندما تعودين 🌸'}});
 steps.push({s:`وهذه عبارة نحفظها معًا:<div class="mem" style="margin:8px 0 0">⭐ ${esc(c.mem)}</div>`,mood:'proud',r:['حفظتها! 🌟']});
 CH={b,c,ci,k,steps,i:0};
 $('cv').innerHTML=`<div class="card" style="padding:12px"><div class="card-top" style="padding:6px 0 4px"><div class="e">${c.e}</div><h2>${esc(c.t)}</h2></div><div class="chat" id="chat"></div><div class="chips" id="chips"></div></div>`;
 nextStep();
}
function botSay(html,mood,cb){const ch=$('chat');if(!ch)return;const w=document.createElement('div');w.className='msg';w.innerHTML=sana(mood,'sm')+'<div class="b"><span class="typing"><i></i><i></i><i></i></span></div>';ch.appendChild(w);w.scrollIntoView({behavior:'smooth',block:'end'});
 setTimeout(()=>{if(!w.isConnected)return;w.querySelector('.b').innerHTML=html;sfx.soft();w.scrollIntoView({behavior:'smooth',block:'end'});cb&&cb();},650);}
function meSay(t){const ch=$('chat');const w=document.createElement('div');w.className='msg me';w.innerHTML='<div class="b">'+esc(t)+'</div>';ch.appendChild(w);}
function chips(list,fn,cls){const c=$('chips');c.innerHTML='';list.forEach((t,n)=>{const b=document.createElement('button');b.className='chip '+(cls||'');b.textContent=t;b.onclick=()=>{c.innerHTML='';sfx.pop();fn(t,n);};c.appendChild(b);});}
function nextStep(){
 if(!CH)return;const st=CH.steps[CH.i];
 if(!st){botSay(S.done[CH.k]?'لقد أكملتِ هذه البطاقة من قبل، وأنا فخورة بكِ! 💜':'وصلنا لنهاية البطاقة! هل نعلّمها مكتملة؟',S.done[CH.k]?'proud':'happy',()=>{$('chips').outerHTML='<div id="chips"></div>';$('chips').innerHTML=finishBtns(CH.b,CH.ci);});return;}
 CH.i++;
 if(st.q){const c=CH.c;botSay(`🤔 سؤال لكِ: <b>${esc(c.q)}</b>`,'think',()=>chips(c.o.map(o=>o[0]),(t,n)=>{meSay(t);const o=c.o[n];const first=S.ans[CH.k]==null;S.ans[CH.k]=n;save();if(first)addXP(5,'شكرًا لأنكِ فكّرتِ');
   const lead=o[1]==='best'?pick(PRAISE):o[1]==='ok'?pick(GENTLE):pick(REDIRECT);
   botSay(`${lead}<br>${esc(o[2])}`,o[1]==='best'?'proud':'think',()=>{
    chips(['أريني كل الاحتمالات 👀','أكملي ←'],(t2)=>{meSay(t2);if(t2.startsWith('أريني')){botSay(c.o.map(x=>`${x[1]==='best'?'🌟':x[1]==='ok'?'🤔':'💭'} <b>${esc(x[0])}</b><br><span class="small">${esc(x[2])}</span>`).join('<hr class="s">')+(c.why?`<hr class="s">💭 ${esc(c.why)}`:''),'think',()=>chips(['فهمت 👍'],t3=>{meSay(t3);nextStep();}));}else nextStep();});});
  },'opt2'));return;}
 botSay(st.s,st.mood,()=>chips(st.r||['أكملي ←'],t=>{meSay(t);if(st.react&&st.react[t])botSay(st.react[t],'happy',()=>setTimeout(nextStep,250));else nextStep();}));
}

/* ================= JOURNAL ================= */
let unlocked=false,jd={f:null,lv:null,help:{}};
const HELPS=['🎈 تنفّستُ ببطء','💬 تكلمتُ مع ماما أو بابا','🤲 دعوتُ الله','🎨 رسمتُ أو كتبتُ','⚽ تحركتُ أو لعبتُ','🤗 طلبتُ حضنًا','✋ قلتُ «توقف» بأدب','😴 استرحتُ قليلًا','🧑‍🏫 طلبتُ المساعدة'];
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('rihla:'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){let h=0;for(const ch of 'rihla:'+s)h=(h*31+ch.charCodeAt(0))|0;return 'f'+h;}}
function vJournal(){
 if(S.pin&&!unlocked){app.innerHTML=guide('هذا دفترك الخاص 🔒 اكتبي رقمك السري لنفتحه.','think')+`<div class="panel"><input type="password" inputmode="numeric" maxlength="6" id="pinIn" placeholder="الرقم السري"><div class="rowbtn"><button class="btn main" onclick="tryPin()">🔓 افتحي الدفتر</button></div></div>`;return;}
 const F=(box('feel')||{cards:[]}).cards;
 app.innerHTML=guide('هنا مساحتك الخاصة يا صديقتي. كل المشاعر مسموحة 💗 اختاري ما تشعرين به الآن، ولا توجد إجابة خاطئة.','happy')+
 `<div class="panel"><h3>📔 أنا أشعر بـ...</h3>
  <div class="feelgrid" style="margin-top:10px">${(()=>{const L=F.map((c,n)=>[c,n]).filter(x=>!x[0].sk);const V=jd.more?L:L.filter((x,k)=>k<24||x[1]===jd.f);return V.map(([c,n])=>`<button class="fe ${jd.f===n?'on':''}" onclick="jd.f=${n};jKeep();vJournal()"><span>${c.e}</span>${esc(c.t)}</button>`).join('')+`<button class="fe" onclick="jKeep();jd.more=!jd.more;vJournal()"><span>${jd.more?'🔼':'➕'}</span>${jd.more?'مشاعر أقل':'مشاعر أكثر ('+(L.length-24)+')'}</button>`;})()}</div>
  <label class="l">ما حجم الشعور؟</label><div class="lvls">${[1,2,3,4,5].map(v=>`<button class="${jd.lv===v?'on':''}" onclick="jd.lv=${v};jKeep();vJournal()">${['🙂','😐','😟','😣','🌋'][v-1]} ${v}</button>`).join('')}</div>
  <label class="l">لماذا أشعر بهذا؟</label><textarea id="jw" rows="3" placeholder="اليوم حدث...">${esc(jd.w||'')}</textarea>
  <label class="l">كيف تعاملتُ أو سأتعامل معه؟</label><div class="chips" style="justify-content:flex-start">${HELPS.map((h,n)=>`<button class="chip" style="${jd.help[n]?'background:var(--mint);border-color:#8fd3b3':''}" onclick="jKeep();jd.help[${n}]=!jd.help[${n}];vJournal()">${h}</button>`).join('')}</div>
  <textarea id="jh" rows="2" placeholder="شيء آخر ساعدني...">${esc(jd.h||'')}</textarea>
  <label class="l">💭 تأملاتي (اختياري)</label><textarea id="jr" rows="3" placeholder="ماذا تعلمتُ اليوم عن نفسي؟">${esc(jd.r||'')}</textarea>
  <div class="rowbtn"><button class="btn main" onclick="saveJ()">💾 احفظي في دفتري</button>${jd.f!=null?`<a class="btn" href="#card-feel-${jd.f}">📖 اقرئي بطاقة «${esc(F[jd.f].t)}»</a>`:''}</div>
  <p class="small">${S.pin?'🔒 دفترك مقفل برقم سري.':'💡 يمكنك قفل الدفتر برقم سري من الإعدادات ⚙️.'} الدفتر محفوظ على هذا الجهاز فقط، ولا يُرسل إلى أي مكان.</p></div>
 <div class="panel"><h3>🗓️ صفحاتي (${S.journal.length})</h3>${S.journal.length?S.journal.map((e,n)=>{const c=F[e.f]||{e:'💭',t:''};return `<div class="entry"><div class="h"><span>${c.e}</span><div><b>${esc(c.t)}</b> · ${['🙂','😐','😟','😣','🌋'][e.lv-1]||''} ${e.lv}/5<br><small>${new Date(e.d).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}</small></div><button class="btn" style="margin-inline-start:auto;padding:4px 10px" onclick="delJ(${n},this)">🗑️</button></div>${e.w?`<p>📝 ${esc(e.w)}</p>`:''}${e.hs&&e.hs.length?`<p>🧰 ${e.hs.map(esc).join('، ')}</p>`:''}${e.r?`<p>💭 ${esc(e.r)}</p>`:''}</div>`;}).join(''):'<p class="small">لا توجد صفحات بعد. اكتبي أول صفحة! 🌱</p>'}</div>`;
}
function jKeep(){const w=$('jw'),h=$('jh'),r=$('jr');if(w)jd.w=w.value;if(h)jd.h=h.value;if(r)jd.r=r.value;}
function saveJ(){jKeep();if(jd.f==null){toast('اختاري شعورًا أولًا 🙂');return;}if(!jd.lv){toast('اختاري حجم الشعور من 1 إلى 5');return;}
 const hs=HELPS.filter((_,n)=>jd.help[n]);if(jd.h&&jd.h.trim())hs.push(jd.h.trim());
 S.journal.unshift({d:new Date().toISOString(),f:jd.f,lv:jd.lv,w:(jd.w||'').trim().slice(0,800),hs,r:(jd.r||'').trim().slice(0,800)});
 const t=today();S.jcount=S.jcount||{};S.jcount[t]=(S.jcount[t]||0)+1;save();
 if(S.jcount[t]<=2)addXP(10,'شكرًا لأنكِ عبّرتِ عن شعورك');else{sfx.pop();toast('💾 حُفظت الصفحة');}
 jd={f:null,lv:null,help:{}};checkBadges();vJournal();}
function delJ(n,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='حذف؟';return;}S.journal.splice(n,1);save();vJournal();}
async function tryPin(){const v=$('pinIn').value;if(await hash(v)===S.pin){unlocked=true;sfx.chest();vJournal();}else{toast('الرقم غير صحيح، حاولي مرة أخرى');}}

let QZ=null;
function vQuiz(){
 const wk=weekKey(),doneW=S.quiz[wk]!=null;
 let pool=[];BOXES.forEach(b=>b.cards.forEach((c,i)=>{if(c.q&&c.o&&c.o.some(o=>o[1]==='best'))pool.push([b.id,i]);}));
 const mine=pool.filter(p=>S.done[ck(p[0],p[1])]);
 const src=mine.length>=5?mine:pool;
 QZ={items:shuffle(src).slice(0,5),i:0,score:0,wk};
 app.innerHTML=guide(doneW?`أكملتِ اختبار هذا الأسبوع ✅ (نتيجتك: ${S.quiz[wk]}/5). يمكنك اللعب مرة أخرى للمراجعة، والنقاط تُحسب مرة واحدة كل أسبوع.`:`هذا اختبار الأسبوع اللطيف! 5 أسئلة ${mine.length>=5?'من البطاقات التي أكملتِها':'من بطاقات الرحلة'}. لا تقلقي، الهدف أن نتذكر ونتعلم 💜`,'think')+'<div class="panel" id="qz"></div>';
 qShow();
}
function qShow(){const q=QZ.items[QZ.i];const el=$('qz');if(!el)return;
 if(!q){const first=S.quiz[QZ.wk]==null;if(first){S.quiz[QZ.wk]=QZ.score;save();addXP(20,'أكملتِ اختبار الأسبوع');}confetti();
  el.innerHTML=`<div class="center"><div style="font-size:56px">${QZ.score>=4?'🏆':QZ.score>=2?'🌟':'🌱'}</div><h3>${QZ.score} / 5</h3><p>${QZ.score>=4?'رائع! ذاكرتك قوية وقلبك ذكي.':'أحسنتِ المحاولة! كل سؤال تعلمتِ منه شيئًا.'}</p><button class="btn main" onclick="vQuiz()">🔁 اختبار آخر</button> <a class="btn" href="#review">📚 المراجعة</a></div>`;return;}
 const b=box(q[0]),c=b.cards[q[1]];
 el.innerHTML=`<div class="small">السؤال ${QZ.i+1} من 5 · ${b.e} ${esc(c.t)}</div><h3 style="margin:6px 0">${esc(c.q)}</h3><div id="qa">${shuffle(c.o.map((o,n)=>n)).map(n=>`<button class="opt" data-n="${n}">${esc(c.o[n][0])}</button>`).join('')}</div><div id="qn"></div>`;
 el.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{const n=+btn.dataset.n,o=c.o[n];if(o[1]==='best')QZ.score++;sfx.pop();
  el.querySelectorAll('.opt').forEach(x=>{const m=+x.dataset.n;x.disabled=true;x.classList.add(c.o[m][1]);});btn.style.outline='3px solid #8b6cc4';
  $('qn').innerHTML=`<p class="res">${o[1]==='best'?'🌟':'💭'} ${esc(o[2])}</p><button class="btn main" onclick="QZ.i++;qShow()">التالي ←</button>`;});
}

function vAbout(){
 const total=BOXES.reduce((a,b)=>a+b.cards.length,0);
 app.innerHTML=guide('هذه صفحة لماما وبابا 👪','happy')+`<div class="panel">

 <h3>المبادئ التي التزمنا بها</h3><ul>
 <li>كل المشاعر طبيعية، والمسؤولية على التصرفات. النقاط تُعطى على الفضول والمحاولة، لا على «مشاعر جيدة».</li>
 <li>لا تشخيصات نفسية، ولا أحكام على نوايا الناس. أوصاف الشخصيات سلوكيات قابلة للتغير.</li>
 <li>تعليم الرحمة مع الحدود: العفو لا يعني قبول الأذى، وحسن الظن لا يعني تجاهل الخطر.</li>
 <li>مواقف حماية النفس: لا أسرار عن الأهل إلا المفاجآت السعيدة، وجسمي ملكي، وأخبر شخصًا كبيرًا موثوقًا.</li>
 <li>الآيات موثقة بالسورة ورقم الآية، والأحاديث بمصدرها ودرجتها، وقصص الشخصيات مقتصرة على المشهور الثابت مع الإشارة إلى ما تنفرد به كتب السيرة والتاريخ.</li></ul>
 <h3>للتحقق</h3><p class="small">نوصي بمراجعة الآيات من المصحف، والأحاديث من موسوعة الدرر السنية (dorar.net) أو كتب الحديث. لم نذكر فتاوى، وإن احتجتم إلى حكم شرعي فاسألوا أهل العلم.</p>
 <h3>الخصوصية</h3><p class="small">لا يوجد تسجيل حساب، ولا تُجمع أي بيانات. كل التقدم والدفتر محفوظ في متصفح هذا الجهاز فقط.</p>
 <h3>كيف تستخدمونه معها؟</h3><p class="small">بطاقة أو بطاقتان يوميًا مع سَنا، ثم حديث قصير عن السؤال، وتحدي اليوم، وصفحة في الدفتر عند الحاجة، واختبار الأسبوع يوم الجمعة مثلًا.</p></div>`;}

/* ================= ROUTER ================= */
function go(h){if(location.hash==='#'+h)route();else location.hash=h;}
function route(){
 const h=(location.hash||'#home').slice(1);CH=null;
 if(!S.days[today()]){S.days[today()]=1;save();setTimeout(()=>once('day:'+today(),5,'زيارة اليوم'),600);}
 if(h.startsWith('box-'))vBox(h.slice(4));
 else if(h.startsWith('card-')){const m=h.match(/^card-([a-z]+)-(\d+)$/);if(m)vCard(m[1],+m[2]);else vHome();}
 else if(h==='journal')vJournal();else if(h==='quiz')vQuiz();else if(h==='review')vReview();else if(h==='badges')vBadges();
 else if(h==='settings')vSettings();else if(h==='about')vAbout();else vHome();
 window.scrollTo({top:0});setTop();
}
defBadges();window.addEventListener('hashchange',route);route();checkBadges();
</script>
