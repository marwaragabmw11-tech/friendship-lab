<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friendship Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&family=Baloo+Bhaijaan+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdf8ee; --card:#fffdf7; --ink:#3b2f2a; --soft:#7a6a60;
  --yellow:#f3b93a; --yellow-l:#fff1cc; --red:#d9534a; --green:#5a9e5f; --green-l:#e3f3e1;
  --purple:#8b6cc4; --purple-l:#eee6fa; --blue:#3f6fb5; --blue-l:#e2ecfa; --bad-l:#fde6e3;
  --line:#eadfcb; --shadow:0 6px 18px rgba(90,60,30,.10);
  --head:'Baloo Bhaijaan 2','Tajawal',sans-serif; --body:'Tajawal',sans-serif;
}
html[lang="en"]{--head:'Baloo 2','Nunito',sans-serif;--body:'Nunito',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  background-image:radial-gradient(circle at 10% 15%,rgba(243,185,58,.09) 0,transparent 40%),radial-gradient(circle at 90% 65%,rgba(139,108,196,.08) 0,transparent 40%);min-height:100vh}
h1,h2,h3{font-family:var(--head);line-height:1.2;margin:0}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
.alt-en{font-family:'Nunito',sans-serif;direction:ltr;text-align:left}
.alt-ar{font-family:'Tajawal',sans-serif;direction:rtl;text-align:right}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(253,248,238,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:760px;margin:0 auto}
.home-btn{border:2px solid var(--line);background:#fff;border-radius:14px;width:40px;height:40px;font-size:20px;flex:0 0 auto}
.brand{font-family:var(--head);font-weight:800;font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--red)}
.stars{background:var(--yellow-l);border:2px solid var(--yellow);border-radius:999px;padding:3px 11px;font-weight:800;font-size:15px;white-space:nowrap}
.lang-btn{border:2px solid var(--blue);background:var(--blue-l);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;white-space:nowrap}

/* common */
.page-h{display:flex;align-items:center;gap:10px;margin:22px 0 4px}
.page-h .ic{font-size:30px}
.page-h h2{font-size:28px}
.sub{color:var(--soft);margin:0 0 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.btn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:7px 13px;font-weight:800;font-size:15px}
a.btn{color:var(--ink)}
.btn.yel{background:var(--yellow-l);border-color:var(--yellow)}
.btn.blu{background:var(--blue-l);border-color:#9db7e3}
.btn.grn{background:var(--green-l);border-color:var(--green)}
.main-btn{background:var(--red);color:#fff;border:none;border-radius:16px;padding:11px 20px;font-weight:800;font-size:17px}
.main-btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.main-btn:disabled{opacity:.35}
.center{text-align:center}
.mt{margin-top:14px}

/* home */
.hero{text-align:center;padding:22px 0 6px}
.hero h1{font-size:clamp(30px,8vw,46px);font-weight:800}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{color:var(--soft);margin:6px 0 0}
.hero img{margin:16px auto 0;width:min(300px,78%);border-radius:24px;border:6px solid #fff;box-shadow:var(--shadow);transform:rotate(-2deg);display:block}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.hub a{text-decoration:none;color:var(--ink);border-radius:22px;padding:16px 14px;border:2px solid var(--line);box-shadow:var(--shadow);display:block;background:var(--card)}
.hub a .e{font-size:36px;line-height:1}
.hub a h3{font-size:21px;margin-top:6px}
.hub a p{margin:2px 0 0;color:var(--soft);font-size:14px;line-height:1.4}
.hub a.wide{grid-column:1/-1;display:flex;gap:14px;align-items:center}

/* list cards */
.list{display:grid;gap:12px}
.item{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.item .thumb{flex:0 0 76px;height:76px;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:36px}
.item .thumb img{width:100%;height:100%;object-fit:cover}
.item h3{font-size:20px}
.item p{margin:2px 0 0;color:var(--soft);font-size:14px;line-height:1.4}
.item .done{margin-inline-start:auto;font-size:22px;flex:0 0 auto}

/* story */
.story{padding:0;overflow:hidden}
.scene-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.ph{width:100%;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ph .pe{font-size:clamp(70px,22vw,120px);line-height:1.1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.ph .pc{font-size:13px;font-weight:700;color:rgba(59,47,42,.55)}
.scene-body{padding:16px 18px 18px}
.scene-num{font-family:var(--head);font-weight:800;color:var(--red);font-size:15px}
.scene-text{font-size:20px;font-weight:600;margin-top:4px}
.scene-text q{quotes:none;font-weight:800;color:#8a3b34}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.other{display:none;margin-top:10px;background:var(--blue-l);border-radius:14px;padding:10px 14px;font-size:17px}
.other.show{display:block}
.choice{margin-top:14px;background:var(--yellow-l);border:2px dashed var(--yellow);border-radius:18px;padding:14px}
.choice h3{font-size:20px;margin-bottom:6px}
.opt{display:block;width:100%;text-align:start;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:7px 0;font-size:16px;font-weight:700}
.opt.good{background:var(--green-l);border-color:var(--green)}
.opt.bad{background:var(--bad-l);border-color:var(--red)}
.fb{display:none;margin-top:8px;font-weight:700;border-radius:12px;padding:10px 12px}
.fb.show{display:block}
.fb.good{background:var(--green-l);color:#2f6b33}
.fb.bad{background:var(--bad-l);color:#9b3129}
.navrow{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line);gap:8px}
.dots{display:flex;gap:5px;justify-content:center;flex:1;min-width:0}
.dot{flex:0 0 9px;width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--red);transform:scale(1.3)}
.end h3{font-size:22px;margin-bottom:6px}
.skillbox{background:var(--green-l);border:2px solid var(--green);border-radius:18px;padding:14px;margin-top:14px}
.thinkbox{background:var(--purple-l);border:2px solid #c9b5ee;border-radius:18px;padding:14px;margin-top:12px}
.thinkbox ol{margin:6px 0 0;padding-inline-start:22px}
.thinkbox li{margin:6px 0;font-weight:600}
.badge-won{text-align:center;margin-top:16px}
.badge-won .bg{font-size:64px;display:inline-block;animation:pop .5s}

/* games */
.g-count{color:var(--soft);font-weight:700;font-size:14px;text-align:center}
.g-say{font-family:var(--head);font-weight:700;font-size:22px;margin:10px 0 4px;min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center}
.g-btns{display:grid;gap:10px;margin-top:14px}
.g-btns.two{grid-template-columns:1fr 1fr}
.g-btns.three{grid-template-columns:1fr 1fr 1fr}
.g-btns button{border-radius:18px;padding:12px 6px;font-size:16px;font-weight:800;border:3px solid var(--line);background:#fff;line-height:1.3}
.g-btns button .big{font-size:30px;display:block}
.g-btns small{display:block;font-size:12px;font-weight:700;color:var(--soft)}
.g-yes{background:var(--green-l)!important;border-color:var(--green)!important}
.g-no{background:var(--bad-l)!important;border-color:var(--red)!important}
.g-fb{min-height:56px;margin-top:12px;font-weight:700;text-align:center}
.feel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.feel-grid button{border:3px solid var(--line);background:#fff;border-radius:18px;padding:10px;font-weight:800;font-size:16px}
.feel-grid button .big{font-size:34px;display:block}
.feel-grid button.good{background:var(--green-l);border-color:var(--green)}
.feel-grid button.bad{background:var(--bad-l);border-color:var(--red)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mcard{aspect-ratio:3/4;border-radius:14px;border:3px solid var(--line);background:linear-gradient(135deg,#f6c86a,#e88aa7);font-size:15px;font-weight:800;display:grid;place-items:center;padding:4px;text-align:center}
.mcard.open{background:#fff}
.mcard.match{background:var(--green-l);border-color:var(--green)}
.mcard .big{font-size:34px}
.result{text-align:center}
.result .big{font-size:60px}
.result h3{font-size:28px}
.mmm-key{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.mmm-key div{border-radius:14px;padding:8px 4px;text-align:center;font-size:13px;font-weight:700;border:2px solid var(--line);background:#fff;line-height:1.35}
.mmm-key b{display:block;font-size:15px}

/* tools */
.balloon-wrap{height:260px;display:grid;place-items:center}
.balloon{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb3c7,#e8577d);box-shadow:0 10px 30px rgba(232,87,125,.35);transition:transform 4s ease-in-out;position:relative}
.balloon::after{content:'';position:absolute;left:50%;bottom:-40px;width:2px;height:40px;background:#c9a;transform:translateX(-50%)}
.breath-txt{font-family:var(--head);font-size:26px;font-weight:800;text-align:center;min-height:40px}
.thermo{display:grid;gap:8px}
.lvl{display:flex;align-items:center;gap:12px;border-radius:18px;padding:10px 14px;border:3px solid transparent;text-align:start;width:100%;background:#fff}
.lvl .big{font-size:34px}
.lvl b{font-size:17px;display:block}
.lvl span{font-size:14px;color:var(--soft)}
.lvl.sel{border-color:var(--ink);transform:scale(1.02)}
.imsg label{display:block;font-weight:800;margin:12px 0 4px}
.imsg select{width:100%;font-family:inherit;font-size:16px;padding:9px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.sentence{margin-top:16px;background:var(--yellow-l);border:2px solid var(--yellow);border-radius:18px;padding:14px;font-size:20px;font-weight:800;font-family:var(--head)}
.phr-cat{margin-top:18px}
.phr-cat h3{font-size:20px;margin-bottom:8px}
.phr{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin:6px 0}
.phr .t{flex:1;font-weight:700}
.phr .t small{display:block;font-weight:600;color:var(--soft)}
.skill-card{margin-top:12px}
.skill-card h3{font-size:20px}
.skill-card ol{margin:8px 0 0;padding-inline-start:22px}
.skill-card li{margin:4px 0}

/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.bdg .big{font-size:40px}
.bdg b{display:block;font-size:13px;line-height:1.3;margin-top:4px}
.bdg.off{opacity:.35;filter:grayscale(1)}
.q{background:var(--card);border:2px solid var(--line);border-inline-start:6px solid var(--purple);border-radius:16px;padding:12px 14px;margin-top:10px;font-weight:700}
.pill{display:inline-block;background:var(--purple-l);color:#5b3f99;border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px;margin:0 0 6px 4px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px;font-weight:800;transition:transform .3s;z-index:50;max-width:90vw;text-align:center;line-height:1.4}
.toast.show{transform:translateX(-50%) translateY(0)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.pop{animation:pop .35s}
footer{text-align:center;color:var(--soft);font-size:13px;padding:10px 16px 30px}
.jq{font-size:19px;margin:16px 0 8px}
.jq:first-child{margin-top:0}
.three-col{grid-template-columns:repeat(3,1fr)!important;margin-top:0}
.three-col button{padding:8px 4px;font-size:14px}
.three-col button .big{font-size:28px}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvls button{border:3px solid transparent;border-radius:14px;padding:8px 2px;font-size:26px;line-height:1.1}
.lvls button small{display:block;font-size:13px;font-weight:800}
.lvls button.sel{border-color:var(--ink)}
textarea{width:100%;font-family:inherit;font-size:16px;padding:10px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:14px;font-weight:700}
.chip.on{background:var(--green-l);border-color:var(--green)}
.jentry{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px}
.je-top{display:flex;align-items:center;gap:10px}
.je-top .big{font-size:36px}
.je-top small{color:var(--soft)}
.je-top .del{margin-inline-start:auto;padding:4px 9px}
.jentry p{margin:8px 0;white-space:pre-wrap}
.rp-sit{font-weight:800;font-size:19px;text-align:center;margin:8px 0}
.chk{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 10px;margin:6px 0;font-weight:700}
.chk input{width:22px;height:22px;accent-color:var(--green)}
.skill-card ul{margin:8px 0 0;padding-inline-start:22px}
.skill-card ul li{margin:6px 0}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <button class="home-btn" onclick="go('home')" aria-label="Home">🏠</button>
    <div class="brand" id="brand"></div>
    <div class="stars" id="stars">⭐ 0</div>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()"></button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   STATE
   ========================================================= */
let lang='ar';
let stars=0;
let earned={};
let awarded={};
try{
  lang=localStorage.getItem('fl_lang')||'ar';
  stars=+(localStorage.getItem('fl_stars')||0);
  earned=JSON.parse(localStorage.getItem('fl_badges')||'{}');
  awarded=JSON.parse(localStorage.getItem('fl_aw')||'{}');
}catch(e){}
function save(){try{localStorage.setItem('fl_lang',lang);localStorage.setItem('fl_stars',stars);localStorage.setItem('fl_badges',JSON.stringify(earned));localStorage.setItem('fl_aw',JSON.stringify(awarded));}catch(e){}}
const L=o=>o==null?'':(typeof o==='string'?o:(o[lang]??o.en));
const O=o=>o[lang==='ar'?'en':'ar']; // other language
const $=id=>document.getElementById(id);

/* images that exist (add new ones here when they arrive) */
function imgSrc(k){return (window.IMGDATA&&IMGDATA[k])||('img/'+k+'.jpg');}
const IMGS=new Set(['p1','p2','p3','p4','p5','p6','p7','p8','p9',
 's2-1','s2-2','s2-3','s3-1','s3-2','s3-3','s4-1','s4-2','s4-3','s5-1','s5-2','s5-3','s6-1','s6-2','s6-3',
 's2-4','s3-4','s3-5','s4-4','s5-4','s6-4','f2']);

/* =========================================================
   UI TEXT
   ========================================================= */
const T={
  brand:{en:'Friendship <span>Lab</span>',ar:'مختبر <span>الصداقة</span>'},
  langBtn:{en:'عربي',ar:'English'},
  heroTitle:{en:'Be <em>strong</em>, be <em>kind</em>!',ar:'كن <em>قويًا</em>، وكن <em>لطيفًا</em>!'},
  heroSub:{en:'Stories, games and skills to understand feelings, make friends and stand up to bullying.',ar:'قصص وألعاب ومهارات لتفهم مشاعرك، وتكوّن صداقات، وتواجه التنمر.'},
  stories:{en:'Stories',ar:'القصص'}, storiesSub:{en:'6 illustrated stories with choices',ar:'6 قصص مصوّرة تختار فيها ماذا يحدث'},
  games:{en:'Games',ar:'الألعاب'}, gamesSub:{en:'Play, think and win stars',ar:'العب وفكّر واجمع النجوم'},
  tools:{en:'Skills Toolbox',ar:'صندوق المهارات'}, toolsSub:{en:'Calm down, brave words, I-messages and more',ar:'التهدئة، والكلمات الشجاعة، ورسائل «أنا» وأكثر'},
  badges:{en:'My Badges',ar:'أوسمتي'}, badgesSub:{en:'Collect them all!',ar:'اجمعها كلها!'},
  book:{en:'Book Corner',ar:'ركن الكتاب'}, bookSub:{en:'About Real Friends + talk questions',ar:'عن كتاب Real Friends وأسئلة للنقاش'},
  page:{en:'Page',ar:'صفحة'}, of:{en:'of',ar:'من'},
  listen:{en:'🔊 Listen',ar:'🔊 استماع'}, showOther:{en:'🌍 عربي',ar:'🌍 English'},
  next:{en:'Next →',ar:'التالي ←'}, back:{en:'← Back',ar:'→ السابق'}, finish:{en:'Finish ✓',ar:'إنهاء ✓'},
  soon:{en:'Picture coming soon',ar:'الصورة قريبًا'},
  learned:{en:'🧰 Skill I learned',ar:'🧰 المهارة التي تعلمتها'},
  think:{en:'🧠 Think and talk',ar:'🧠 فكّر وتحدّث'},
  thinkSub:{en:'Talk about these with Mom or Dad:',ar:'تحدث عنها مع ماما أو بابا:'},
  newBadge:{en:'New badge!',ar:'وسام جديد!'},
  moreStories:{en:'📚 More stories',ar:'📚 قصص أخرى'},
  correct:{en:'Correct!',ar:'إجابة صحيحة!'}, tryAgain:{en:'Play again ↻',ar:'العب مرة أخرى ↻'},
  great:{en:'Amazing work!',ar:'عمل رائع!'}, good:{en:'Good try! Play again to win the badge.',ar:'محاولة جيدة! العب مرة أخرى لتفوز بالوسام.'},
  allGames:{en:'🎮 All games',ar:'🎮 كل الألعاب'}, allTools:{en:'🧰 All tools',ar:'🧰 كل الأدوات'},
  moves:{en:'Moves',ar:'المحاولات'},
  real:{en:'Real friend',ar:'صديق حقيقي'}, notReal:{en:'Not a friend',ar:'ليس تصرف صديق'},
  ok:{en:'OK',ar:'مقبول'}, notOk:{en:'Not OK',ar:'غير مقبول'},
  start:{en:'Start ▶',ar:'ابدأ ▶'}, stop:{en:'Stop ■',ar:'توقف ■'},
  breatheIn:{en:'Breathe in… 🌬️',ar:'خذ نفسًا… 🌬️'}, breatheOut:{en:'Breathe out… 💨',ar:'أخرج النفس… 💨'},
  breathDone:{en:'Well done! You are calm 😌',ar:'أحسنت! أنت الآن هادئ 😌'},
  hearIt:{en:'🔊 Hear it',ar:'🔊 استمع'},
  noVoice:{en:'🔇 No voice for this language on this device',ar:'🔇 لا يوجد صوت لهذه اللغة على هذا الجهاز'}
};

/* =========================================================
   FEELINGS
   ========================================================= */
const FEEL={
  happy:{e:'😊',en:'happy',ar:'سعيد'}, sad:{e:'😢',en:'sad',ar:'حزين'}, angry:{e:'😠',en:'angry',ar:'غاضب'},
  scared:{e:'😨',en:'scared',ar:'خائف'}, embarrassed:{e:'😳',en:'embarrassed',ar:'محرَج'}, proud:{e:'🥇',en:'proud',ar:'فخور'},
  jealous:{e:'😒',en:'jealous',ar:'غيور'}, nervous:{e:'😬',en:'nervous',ar:'متوتر'}, lonely:{e:'🥺',en:'lonely',ar:'وحيد'},
  shy:{e:'🙈',en:'shy',ar:'خجول'}, bored:{e:'🥱',en:'bored',ar:'ملول'}, excited:{e:'🤩',en:'excited',ar:'متحمس'},
  surprised:{e:'😮',en:'surprised',ar:'متفاجئ'}, calm:{e:'😌',en:'calm',ar:'هادئ'}
};

/* =========================================================
   BADGES
   ========================================================= */
const BADGES={
  s1:{e:'🦸',en:'Upstander',ar:'وسام نصرة الآخرين'},
  s2:{e:'🌋',en:'Feelings Tamer',ar:'وسام تهدئة المشاعر'},

{id:1,color:'#f3b93a',emoji:'🎨',badge:'s1',

 skill:S("Be an upstander: stand with the person who is hurt, say “Stop!”, and get help from an adult. A real friend includes you, listens to you and is kind.","كن ناصرًا لغيرك: قف بجانب من يتأذى، وقل «توقف!»، واطلب المساعدة من شخص كبير. والصديق الحقيقي يُشركك ويسمعك ويكون لطيفًا معك."),
 think:[S("Have you ever felt left out like Lina? What did you do?","هل شعرت يومًا بالاستبعاد مثل لينا؟ ماذا فعلت؟"),S("Why do you think Sara left Lina alone at recess?","لماذا تظن أن سارة تركت لينا وحدها في الفسحة؟"),S("What would you do if you saw someone laughing at a friend's drawing?","ماذا كنت ستفعل لو رأيت أحدًا يضحك على رسمة صديقك؟")],
 scenes:[
  {img:'p1',ph:'🎒🎨',t:S("This is Lina. Today is the first day of school. Lina loves to draw. She holds her sketchbook and thinks: <q>“I want a real friend.”</q>","هذه لينا. اليوم أول يوم في المدرسة. لينا تحب الرسم. تمسك كراسة الرسم وتفكر: <q>«أريد صديقة حقيقية».</q>")},
  {img:'p2',ph:'🖍️😊',t:S("In class, Lina meets Sara. Sara shares her crayons. They draw and laugh together. <q>“You are my best friend!”</q> says Sara.","في الفصل تتعرف لينا على سارة. سارة تشاركها ألوانها، وترسمان وتضحكان معًا. تقول سارة: <q>«أنتِ أعز صديقاتي!»</q>")},
  {img:'p3',ph:'👭😔',t:S("At recess, Sara plays with a new group: Bella and Maya. They laugh and whisper. Nobody says <q>“Come and play!”</q> Lina feels left out.","في الفسحة تلعب سارة مع مجموعة جديدة: بيلا ومايا. يضحكن ويتهامسن، ولا أحد يقول للينا: <q>«تعالي العبي!»</q> تشعر لينا بأنها مُستبعَدة."),
   choice:{q:S("What can Lina do?","ماذا تستطيع لينا أن تفعل؟"),opts:[
    {t:S("Hide alone and cry all day.","تختبئ وحدها وتبكي طوال اليوم."),ok:0,fb:S("Feeling sad is okay, but hiding all day won't help Lina.","الحزن شعور طبيعي، لكن الاختباء طوال اليوم لن يساعد لينا.")},
    {t:S("Walk to them and ask kindly: “Can I play too?”","تذهب إليهن وتسأل بلطف: «هل يمكنني اللعب معكن؟»"),ok:1,fb:S("Great choice! Asking kindly is brave. 🌟","اختيار رائع! السؤال بلطف شجاعة. 🌟")},
    {t:S("Say something mean to Sara.","تقول كلامًا جارحًا لسارة."),ok:0,fb:S("Being mean back makes everyone feel worse.","الرد بكلام جارح يجعل الجميع يشعر بالأسوأ.")}]}},
  {img:'p4',ph:'🍱🥺',t:S("At lunch, Lina sits alone. Her tummy feels tight. <q>“Maybe nobody likes me,”</q> she thinks.","في وقت الغداء تجلس لينا وحدها. تشعر بضيق في بطنها، وتفكر: <q>«ربما لا أحد يحبني».</q>"),
   choice:{q:S("Is it true that nobody likes Lina?","هل صحيح أن لا أحد يحب لينا؟"),opts:[
    {t:S("Yes, it is true.","نعم، هذا صحيح."),ok:0,fb:S("Not really! Lina feels sad, but a feeling is not always a fact.","ليس صحيحًا! لينا حزينة، لكن الشعور ليس دائمًا حقيقة.")},
    {t:S("No. She feels sad, but feelings are not facts. Her family loves her, and new friends can come.","لا. هي حزينة، لكن المشاعر ليست حقائق. عائلتها تحبها، ويمكن أن تأتي صداقات جديدة."),ok:1,fb:S("Yes! Sad thoughts can trick us. 🌟","صحيح! الأفكار الحزينة قد تخدعنا. 🌟")}]}},
  {img:'p5',ph:'👵💛',t:S("At home, Lina tells Grandma everything. Grandma listens and holds her hand. <q>“A real friend makes you feel safe, not small,”</q> says Grandma. <q>“Look for someone who likes what you like.”</q>","في البيت تحكي لينا لجدتها كل شيء. تسمعها الجدة وتمسك يدها وتقول: <q>«الصديق الحقيقي يجعلكِ تشعرين بالأمان، لا بأنكِ صغيرة. ابحثي عن شخص يحب ما تحبينه».</q>")},
  {img:'p6',ph:'📚✏️',t:S("In the library, Lina sees Maya drawing alone. Bella said Maya's drawings are silly, so Maya left the group. Lina shows Maya her sketchbook. <q>“You draw too?”</q> says Maya, with a shy smile.","في المكتبة ترى لينا مايا ترسم وحدها. بيلا قالت إن رسومات مايا سخيفة، فتركت مايا المجموعة. تُري لينا مايا كراستها، فتقول مايا بابتسامة خجولة: <q>«أنتِ ترسمين أيضًا؟»</q>")},
  {img:'p7',ph:'😏🖼️',t:S("The next day, Bella takes Maya's drawing. She holds it up and laughs: <q>“Look at this baby picture!”</q> Some kids giggle. Maya feels very sad. Lina is scared.","في اليوم التالي تأخذ بيلا رسمة مايا وترفعها وتضحك: <q>«انظروا لرسمة الأطفال هذه!»</q> بعض الأطفال يضحكون. مايا حزينة جدًا، ولينا خائفة."),
   choice:{q:S("What should Lina do?","ماذا يجب أن تفعل لينا؟"),opts:[
    {t:S("Laugh with the other kids.","تضحك مع باقي الأطفال."),ok:0,fb:S("Laughing makes the bullying bigger, and Maya feels even worse.","الضحك يكبّر التنمر، ويجعل مايا تشعر بحزن أكبر.")},
    {t:S("Walk away and say nothing.","تبتعد ولا تقول شيئًا."),ok:0,fb:S("Lina is safe, but Maya is still alone. That is a bystander — someone who only watches.","لينا في أمان، لكن مايا ما زالت وحدها. هذا «متفرّج»: شخص يشاهد فقط.")},
    {t:S("Stand next to Maya, say “Stop!”, and get the teacher.","تقف بجانب مايا، وتقول «توقفي!»، وتنادي المعلمة."),ok:1,fb:S("Wow! That is an upstander — someone who helps. 🦸","رائع! هذا «ناصر»: شخص يساعد غيره. 🦸")}]}},
  {img:'p8',ph:'✋🧑‍🏫',t:S("Lina stands next to Maya. <q>“Stop! That is not kind,”</q> she says. Her voice shakes, but she is brave. Ms. Noor, the teacher, comes: <q>“Bella, please give the drawing back.”</q>","تقف لينا بجانب مايا وتقول: <q>«توقفي! هذا ليس لطيفًا».</q> صوتها يرتجف لكنها شجاعة. تأتي المعلمة مس نور وتقول: <q>«بيلا، أعيدي الرسمة من فضلك».</q>")},
  {img:'p9',ph:'👧👧👧🎨',t:S("After school, Sara says sorry: <q>“I left you out. That was not fair.”</q> Now Lina, Sara and Maya make a comic together. A real friend includes you, listens to you, and is kind — even when it is hard.","بعد المدرسة تعتذر سارة: <q>«تركتكِ وحدكِ، وهذا لم يكن عدلًا».</q> والآن ترسم لينا وسارة ومايا قصة مصوّرة معًا. الصديق الحقيقي يُشركك ويسمعك ويكون لطيفًا، حتى في الأوقات الصعبة.")}
 ]},
{id:2,color:'#e8774a',emoji:'🌋',badge:'s2',
 title:S("Omar's Volcano","بركان عمر"),
 tag:S("Understanding & calming big feelings","فهم المشاعر الكبيرة وتهدئتها"),
 skill:S("1) Notice your body clues. 2) Name your feeling. 3) Calm down with balloon breaths. 4) Then talk: “I feel… because…”. All feelings are okay — what we do with them is our choice.","١) لاحظ إشارات جسمك. ٢) سمِّ شعورك. ٣) اهدأ بأنفاس البالون. ٤) ثم تكلّم: «أشعر بـ... لأن...». كل المشاعر مقبولة، أما ما نفعله بها فهو اختيارنا."),
 think:[S("What makes you feel like a volcano?","ما الذي يجعلك تشعر وكأنك بركان؟"),S("Where in your body do you feel anger? Where do you feel fear?","أين تشعر بالغضب في جسمك؟ وأين تشعر بالخوف؟"),S("What helps you calm down?","ما الذي يساعدك على الهدوء؟")],
 scenes:[
  {img:'s2-1',ph:'⚽😠',t:S("Omar loves football. Today his team loses at recess. His face gets hot. His hands make fists. Omar feels like a volcano!","عمر يحب كرة القدم. اليوم خسر فريقه في الفسحة. أصبح وجهه ساخنًا، وانقبضت يداه. يشعر عمر وكأنه بركان!"),
   choice:{q:S("What is Omar feeling?","بماذا يشعر عمر؟"),opts:[
    {t:S("😊 Happy","😊 سعيد"),ok:0,fb:S("Look at the clues: a hot face and fists don't show happiness.","انظر إلى الإشارات: الوجه الساخن واليدان المنقبضتان لا تدل على السعادة.")},
    {t:S("😠 Angry","😠 غاضب"),ok:1,fb:S("Yes! A hot face and fists are body clues of anger.","صحيح! الوجه الساخن واليدان المنقبضتان إشارات جسدية للغضب.")},
    {t:S("🥱 Sleepy","🥱 نعسان"),ok:0,fb:S("Not sleepy! His body is full of energy.","ليس نعسانًا! جسمه مليء بالطاقة.")}]}},
  {img:'s2-1',ph:'😤💥',t:S("<q>“It's not fair!”</q> Omar shouts. He wants to kick the ball hard at Ziad.","يصرخ عمر: <q>«هذا ليس عدلًا!»</q> ويريد أن يركل الكرة بقوة نحو زياد."),
   choice:{q:S("What should Omar do first?","ماذا يجب أن يفعل عمر أولًا؟"),opts:[
    {t:S("Kick the ball hard at Ziad.","يركل الكرة بقوة نحو زياد."),ok:0,fb:S("Someone could get hurt, and Omar would feel worse.","قد يتأذى أحد، وسيشعر عمر بالأسوأ.")},
    {t:S("Stop and take 3 slow balloon breaths.","يتوقف ويأخذ 3 أنفاس بطيئة مثل نفخ البالون."),ok:1,fb:S("Great! First calm your body, then think.","رائع! أولًا هدّئ جسمك، ثم فكّر.")},
    {t:S("Run away and hide.","يهرب ويختبئ."),ok:0,fb:S("Hiding doesn't help Omar understand his feeling.","الاختباء لا يساعد عمر على فهم شعوره.")}]}},
  {img:'s2-2',ph:'🎈🌬️',t:S("Omar stops. He breathes in slowly, like filling a big balloon… and breathes out slowly. One, two, three. The volcano gets smaller. Now Omar can think.","يتوقف عمر. يأخذ نفسًا بطيئًا كأنه ينفخ بالونًا كبيرًا… ثم يخرجه ببطء. واحد، اثنان، ثلاثة. البركان يصغر، والآن يستطيع عمر أن يفكر.")},
  {img:'s2-4',fb:'s2-2',ph:'🗣️😔',t:S("Omar says: <q>“I feel angry because we lost. I need a minute.”</q> Ziad looks down and says quietly: <q>“I feel bad when we lose too.”</q>","يقول عمر: <q>«أشعر بالغضب لأننا خسرنا، أحتاج دقيقة».</q> ينظر زياد إلى الأرض ويقول بصوت هادئ: <q>«وأنا أيضًا أشعر بالضيق عندما نخسر».</q>"),
   choice:{q:S("Look at Ziad. How does he feel?","انظر إلى زياد. بماذا يشعر؟"),opts:[
    {t:S("😞 Disappointed","😞 محبَط"),ok:1,fb:S("Yes! Eyes down and a quiet voice show he is disappointed too. Other people have feelings like us.","صحيح! النظر إلى الأرض والصوت الهادئ يدلان على أنه محبط أيضًا. الآخرون لديهم مشاعر مثلنا.")},
    {t:S("🤩 Excited","🤩 متحمس"),ok:0,fb:S("Look again: his eyes are down and his voice is quiet.","انظر مرة أخرى: عيناه إلى الأرض وصوته هادئ.")},
    {t:S("😠 Angry at Omar","😠 غاضب من عمر"),ok:0,fb:S("Ziad isn't angry at Omar — he is sad about losing.","زياد ليس غاضبًا من عمر، بل حزين بسبب الخسارة.")}]}},
  {img:'s2-3',ph:'🤝⚽',t:S("Omar and Ziad shake hands. <q>“Let's practice together tomorrow!”</q> says Omar. Feelings are okay. What we do with them is our choice.","يتصافح عمر وزياد. يقول عمر: <q>«لنتدرب معًا غدًا!»</q> كل المشاعر مقبولة، لكن ما نفعله بها هو اختيارنا.")}
 ]},
{id:3,color:'#5fb3c9',emoji:'🫧',badge:'s3',
 title:S("Nour's Invisible Bubble","فقاعة نور الخفية"),
 tag:S("Setting boundaries · Saying no","وضع الحدود · قول «لا»"),
 skill:S("Set boundaries: say what you want with a strong, kind voice (“Please ask me first.” “No, I don't want that.”). Listen to your warning feeling. If someone doesn't stop, tell a trusted adult. Your body belongs to you.","ضع حدودك: قل ما تريده بصوت قوي ولطيف («استأذن مني أولًا من فضلك»، «لا، لا أريد ذلك»). انتبه لشعور التحذير داخلك. وإذا لم يتوقف أحد، فأخبر شخصًا كبيرًا تثق به. جسمك ملكك."),
 think:[S("What is inside your bubble? What is okay for you and what is not?","ما الذي داخل فقاعتك؟ ما المقبول لك وما غير المقبول؟"),S("Is it hard for you to say “no”? Why?","هل يصعب عليك أن تقول «لا»؟ لماذا؟"),S("Who are the trusted adults you can tell?","من هم الكبار الذين تثق بهم وتستطيع أن تحكي لهم؟")],
 scenes:[
  {img:'s3-1',ph:'🫧👧',t:S("Mom tells Nour: <q>“Imagine an invisible bubble around you. It is your space. You choose who comes in and what is okay for you.”</q>","تقول ماما لنور: <q>«تخيّلي فقاعة خفية حولك. هذه مساحتك، وأنتِ من تختارين من يدخلها وما المقبول بالنسبة لك».</q>")},
  {img:'s3-4',fb:'s3-1',ph:'✏️😣',t:S("Every day, Karim takes Nour's colored pencils without asking. Nour feels annoyed, but she says nothing.","كل يوم يأخذ كريم ألوان نور دون أن يستأذن. تشعر نور بالضيق، لكنها لا تقول شيئًا."),
   choice:{q:S("What can Nour say?","ماذا تستطيع نور أن تقول؟"),opts:[
    {t:S("“Fine… take them all.”","«حسنًا… خذها كلها».") ,ok:0,fb:S("That's the 🐭 Mouse way — too quiet. Karim won't know it bothers Nour.","هذه طريقة 🐭 الفأر: هادئة أكثر من اللازم. كريم لن يعرف أن هذا يضايق نور.")},
    {t:S("“Give them back, you thief!”","«أرجعها يا لص!»"),ok:0,fb:S("That's the 👹 Monster way — too mean. Mean words start a fight.","هذه طريقة 👹 الوحش: جارحة أكثر من اللازم. الكلام الجارح يبدأ شجارًا.")},
    {t:S("“Karim, please ask me before you take my pencils.”","«يا كريم، من فضلك استأذن مني قبل أن تأخذ ألواني»."),ok:1,fb:S("That's the 🦁 strong and kind way!","هذه هي الطريقة 🦁 القوية واللطيفة!")}]}},
  {img:'s3-2',ph:'📓😟',t:S("Nour's friend Laila says: <q>“Let me copy your homework, or I won't be your friend!”</q> Nour's tummy feels funny. That funny feeling is a warning signal.","تقول صديقتها ليلى: <q>«دعيني أنقل واجبك، وإلا فلن أكون صديقتك!»</q> تشعر نور بشيء غريب في بطنها. هذا الشعور الغريب إشارة تحذير."),
   choice:{q:S("What should Nour do?","ماذا يجب أن تفعل نور؟"),opts:[
    {t:S("“Okay… here.”","«حسنًا… تفضّلي»."),ok:0,fb:S("Nour would do something she feels is wrong, just to keep Laila happy.","ستفعل نور شيئًا تشعر أنه خطأ لمجرد إرضاء ليلى.")},
    {t:S("“No. I can help you understand it, but you can't copy.”","«لا. أستطيع أن أساعدك لتفهميه، لكن لن تنقليه»."),ok:1,fb:S("Yes! Nour says no and still offers kind help. A real friend doesn't use threats.","صحيح! قالت نور «لا» وعرضت مساعدة لطيفة. الصديق الحقيقي لا يهدد.")},
    {t:S("Cry and run away.","تبكي وتهرب."),ok:0,fb:S("Nour can stay and use her strong voice.","تستطيع نور أن تبقى وتستخدم صوتها القوي.")}]}},
  {img:'s3-5',ph:'🤭✋',t:S("At a family visit, Nour's cousin tickles her. She laughs at first, then says: <q>“Stop, please!”</q> But he doesn't stop.","في زيارة عائلية يدغدغها ابن عمها. تضحك في البداية ثم تقول: <q>«توقف من فضلك!»</q> لكنه لا يتوقف."),
   choice:{q:S("What should Nour do now?","ماذا يجب أن تفعل نور الآن؟"),opts:[
    {t:S("Keep laughing so he isn't upset.","تستمر في الضحك حتى لا يزعل."),ok:0,fb:S("Nour's feelings matter too. When she says stop, he must stop.","مشاعر نور مهمة أيضًا. عندما تقول «توقف» يجب أن يتوقف.")},
    {t:S("Say “STOP!” in a loud strong voice and go to Mom.","تقول «توقف!» بصوت عالٍ وقوي، وتذهب إلى ماما."),ok:1,fb:S("Exactly! Your body belongs to you. If someone doesn't stop, tell an adult.","تمامًا! جسمك ملكك. وإذا لم يتوقف أحد، فأخبر شخصًا كبيرًا.")},
    {t:S("Stay quiet.","تسكت."),ok:0,fb:S("Staying quiet won't make it stop. Use your strong voice.","السكوت لن يوقفه. استخدمي صوتك القوي.")}]}},
  {img:'s3-3',ph:'🦸‍♀️🫧',t:S("Nour feels proud. <q>“Saying no doesn't make me mean,”</q> she thinks. <q>“It keeps me safe, and it teaches others how to treat me.”</q>","تشعر نور بالفخر وتفكر: <q>«عندما أقول لا، فهذا لا يجعلني سيئة، بل يحميني ويعلّم الآخرين كيف يعاملونني».</q>")}
 ]},
{id:4,color:'#3f6fb5',emoji:'🦁',badge:'s4',
 title:S("Yusuf Stands Tall","يوسف يقف شامخًا"),
 tag:S("Facing name-calling · Brave body & voice","مواجهة الألقاب المؤذية · الجسم والصوت الشجاع"),
 skill:S("Use your Brave Body (stand tall, look at the eyes) and Brave Voice (calm and strong). Say it once — “My name is ___. Stop it.” — then walk away. Report bullying to an adult: reporting is not tattling.","استخدم جسمك الشجاع (قف مستقيمًا، وانظر في العينين) وصوتك الشجاع (هادئ وقوي). قلها مرة واحدة: «اسمي ___. توقف». ثم ابتعد. وأبلغ شخصًا كبيرًا عن التنمر، فالإبلاغ ليس «فتنة»."),
 think:[S("Show your Brave Body! How do you stand? How do you look?","أرِنا جسمك الشجاع! كيف تقف؟ وكيف تنظر؟"),S("Why do you think some kids call others names?","لماذا تظن أن بعض الأطفال يطلقون ألقابًا مؤذية على غيرهم؟"),S("What is the difference between tattling and reporting?","ما الفرق بين «الفتنة» والإبلاغ؟")],
 scenes:[
  {img:'s4-1',ph:'👓😞',t:S("Yusuf is new at school. He wears big round glasses. Every day, Tarek calls him <q>“Four Eyes”</q>. Yusuf looks at the floor, and his shoulders drop.","يوسف تلميذ جديد في المدرسة، ويلبس نظارة كبيرة مستديرة. كل يوم يناديه طارق: <q>«أبو أربع عيون»</q>. ينظر يوسف إلى الأرض وتنخفض كتفاه."),
   choice:{q:S("How does Yusuf feel?","بماذا يشعر يوسف؟"),opts:[
    {t:S("😳 Hurt and embarrassed","😳 مجروح ومحرَج"),ok:1,fb:S("Yes. Looking down and dropped shoulders show he feels hurt.","صحيح. النظر إلى الأرض والكتفان المنخفضتان تدل على أنه مجروح.")},
    {t:S("🥇 Proud","🥇 فخور"),ok:0,fb:S("Look at his body: proud people stand tall.","انظر إلى جسمه: الفخور يقف مستقيمًا.")},
    {t:S("🥱 Bored","🥱 ملول"),ok:0,fb:S("Name-calling hurts. He isn't bored.","الألقاب المؤذية تجرح. هو ليس ملولًا.")}]}},
  {img:'s4-2',ph:'🪞💪',t:S("Yusuf's big brother, Ali, teaches him the <b>Brave Body</b>: stand tall, shoulders back, look at the eyes, and use a calm, strong voice. They practice in front of the mirror.","علّمه أخوه الكبير علي <b>«الجسم الشجاع»</b>: قف مستقيمًا، وارفع كتفيك، وانظر في العينين، وتكلّم بصوت هادئ وقوي. وتدرّبا معًا أمام المرآة.")},
  {img:'s4-1',ph:'😏👓',t:S("The next day, Tarek laughs: <q>“Hey, Four Eyes!”</q>","في اليوم التالي يضحك طارق: <q>«أهلًا يا أبو أربع عيون!»</q>"),
   choice:{q:S("What should Yusuf do?","ماذا يجب أن يفعل يوسف؟"),opts:[
    {t:S("Look down and whisper: “please…”","ينظر إلى الأرض ويهمس: «من فضلك…»"),ok:0,fb:S("That's the 🐭 Mouse way. Tarek may keep going.","هذه طريقة 🐭 الفأر. قد يستمر طارق.")},
    {t:S("Shout “Shut up, you idiot!” and push him.","يصرخ «اسكت يا غبي!» ويدفعه."),ok:0,fb:S("That's the 👹 Monster way. Yusuf could get in trouble too.","هذه طريقة 👹 الوحش. قد يقع يوسف في مشكلة هو أيضًا.")},
    {t:S("Stand tall: “My name is Yusuf. Stop it.” Then walk to his friends.","يقف مستقيمًا: «اسمي يوسف. توقف». ثم يذهب إلى أصدقائه."),ok:1,fb:S("That's the 🦁 Brave way! Short, calm and strong.","هذه هي الطريقة 🦁 الشجاعة! قصيرة وهادئة وقوية.")}]}},
  {img:'s4-4',fb:'s4-1',ph:'🧑‍🏫📢',t:S("Tarek tries again. Yusuf says the same words calmly, like a broken record. Then he tells Mr. Hassan, the teacher.","يحاول طارق مرة أخرى، فيكرر يوسف نفس الكلمات بهدوء. ثم يخبر الأستاذ حسن."),
   choice:{q:S("Is telling the teacher “tattling”?","هل إخبار المعلم يُعتبر «فتنة»؟"),opts:[
    {t:S("Yes, Yusuf is a tattletale.","نعم، يوسف «فتّان»."),ok:0,fb:S("No! Tattling is trying to get someone in trouble over small things. Reporting is getting help when someone is hurt.","لا! «الفتنة» هي محاولة إيقاع أحد في مشكلة بسبب أشياء صغيرة. أما الإبلاغ فهو طلب المساعدة عندما يتأذى أحد.")},
    {t:S("No. He is reporting to stay safe.","لا. هو يُبلغ ليبقى في أمان."),ok:1,fb:S("Right! Reporting bullying is smart and brave.","صحيح! الإبلاغ عن التنمر تصرف ذكي وشجاع.")}]}},
  {img:'s4-3',ph:'👓😄',t:S("Mr. Hassan talks to Tarek. The next week, Tarek says: <q>“Sorry, Yusuf. Your glasses are cool — like a scientist!”</q> Now they play together. Yusuf smiles. What others say about you is not who you are.","يتحدث الأستاذ حسن مع طارق. وفي الأسبوع التالي يقول طارق: <q>«آسف يا يوسف. نظارتك رائعة، كأنك عالِم!»</q> والآن يلعبون معًا. يبتسم يوسف. ما يقوله الآخرون عنك لا يحدد من أنت.")}
 ]},
{id:5,color:'#e88aa7',emoji:'💞',badge:'s5',
 title:S("Hana and the Quiet New Girl","هَنا والبنت الجديدة الهادئة"),
 tag:S("Reading others · Empathy · Starting a chat","فهم الآخرين · التعاطف · بدء الحديث"),
 skill:S("Read faces and bodies. Think before you judge — there can be many reasons. Start a chat: say hi, say your name, ask a question. Listen with your eyes, ears and heart.","اقرأ الوجوه وحركات الجسم. فكّر قبل أن تحكم، فقد تكون هناك أسباب كثيرة. ابدأ الحديث: ألقِ التحية، وقل اسمك، واسأل سؤالًا. واستمع بعينيك وأذنيك وقلبك."),
 think:[S("Have you ever been new somewhere? How did you feel?","هل كنت جديدًا في مكان ما؟ بماذا شعرت؟"),S("What 3 questions can you ask to get to know someone?","ما ثلاثة أسئلة يمكنك أن تسألها لتتعرف على شخص؟"),S("Why is it wrong to judge someone quickly?","لماذا من الخطأ أن نحكم على شخص بسرعة؟")],
 scenes:[
  {img:'s5-1',ph:'🧳🤐',t:S("A new girl, Rosa, joins Hana's class. She came from another country. She doesn't talk and doesn't smile. Some kids whisper: <q>“She is rude.”</q>","انضمت بنت جديدة اسمها روزا إلى فصل هَنا. جاءت من بلد آخر. لا تتكلم ولا تبتسم. يتهامس بعض الأطفال: <q>«إنها قليلة الذوق».</q>"),
   choice:{q:S("Why might Rosa be quiet?","لماذا قد تكون روزا هادئة؟"),opts:[
    {t:S("She is rude.","لأنها قليلة الذوق."),ok:0,fb:S("Maybe not! We don't know yet. Think of other reasons.","ربما لا! نحن لا نعرف بعد. فكّر في أسباب أخرى.")},
    {t:S("She may feel shy or scared, or she doesn't know the language yet.","ربما تشعر بالخجل أو الخوف، أو لا تعرف اللغة بعد."),ok:1,fb:S("Great thinking! There can be many reasons. Think before you judge.","تفكير رائع! قد تكون هناك أسباب كثيرة. فكّر قبل أن تحكم.")},
    {t:S("She doesn't like anyone.","لأنها لا تحب أحدًا."),ok:0,fb:S("She just arrived — she doesn't know anyone yet!","لقد وصلت للتو، ولا تعرف أحدًا بعد!")}]}},
  {img:'s5-1',ph:'👀🎒',t:S("Hana looks closely. Rosa's eyes are down. Her hands hold her bag tightly. Her feet don't move.","تنظر هَنا جيدًا: عينا روزا إلى الأسفل، ويداها تمسكان حقيبتها بقوة، وقدماها لا تتحركان."),
   choice:{q:S("What do these clues tell Hana?","ماذا تخبر هذه الإشارات هَنا؟"),opts:[
    {t:S("😬 Rosa feels nervous.","😬 روزا متوترة."),ok:1,fb:S("Yes! Face and body clues tell us how people feel, even without words.","صحيح! إشارات الوجه والجسم تخبرنا بمشاعر الناس حتى بدون كلام.")},
    {t:S("😠 Rosa is angry.","😠 روزا غاضبة."),ok:0,fb:S("Angry people often frown and make fists. Rosa looks down and holds her bag.","الغاضب عادة يعقد حاجبيه ويقبض يديه. روزا تنظر للأسفل وتمسك حقيبتها.")},
    {t:S("🤩 Rosa is excited.","🤩 روزا متحمسة."),ok:0,fb:S("Excited people smile and move a lot. Look again!","المتحمس يبتسم ويتحرك كثيرًا. انظر مرة أخرى!")}]}},
  {img:'s5-2',ph:'👋🙂',t:S("Hana smiles and speaks slowly: <q>“Hi! I'm Hana. Do you want to sit with me?”</q> She points to the chair. Rosa nods.","تبتسم هَنا وتتكلم ببطء: <q>«مرحبًا! اسمي هَنا. هل تريدين الجلوس معي؟»</q> وتشير إلى الكرسي. تومئ روزا برأسها.")},
  {img:'s5-4',fb:'s5-2',ph:'🐱💬',t:S("At recess, Hana asks: <q>“What do you like?”</q> Rosa says: <q>“Cats!”</q> Hana looks at her, nods, and asks: <q>“What is your cat's name?”</q>","في الفسحة تسألها هَنا: <q>«ماذا تحبين؟»</q> تقول روزا: <q>«القطط!»</q> تنظر إليها هَنا وتومئ وتسأل: <q>«ما اسم قطتك؟»</q>"),
   choice:{q:S("Which one is good listening?","أيّها استماع جيد؟"),opts:[
    {t:S("Look at her, nod, and ask more questions.","تنظر إليها، وتومئ، وتسأل أسئلة أخرى."),ok:1,fb:S("Yes! Listen with your eyes, ears and heart.","صحيح! استمع بعينيك وأذنيك وقلبك.")},
    {t:S("Talk only about yourself.","تتكلم عن نفسها فقط."),ok:0,fb:S("A chat is like a ball game — you pass and you catch.","الحديث مثل لعبة الكرة: تمرر وتستقبل.")},
    {t:S("Look away and play with something.","تنظر بعيدًا وتلعب بشيء."),ok:0,fb:S("Rosa may think Hana doesn't care.","قد تظن روزا أن هَنا لا تهتم.")}]}},
  {img:'s5-3',ph:'📖🌍',t:S("Rosa teaches Hana a word in her language. Hana teaches Rosa words in Arabic. Now they are friends. Being kind to someone new can change their whole day.","تعلّم روزا هَنا كلمة بلغتها، وتعلّم هَنا روزا كلمات بالعربية. الآن أصبحتا صديقتين. لطفك مع شخص جديد قد يغيّر يومه كله.")}
 ]},
{id:6,color:'#8b6cc4',emoji:'📱',badge:'s6',
 title:S("Adam and the Class Chat","آدم ومجموعة الفصل"),
 tag:S("Online bullying · Being kind online","التنمر على الإنترنت · اللطف على الإنترنت"),
 skill:S("Online: Stop (don't reply), Screenshot, Show an adult. Before you post, ask: Is it true? Is it kind? Is it needed? Behind every screen is a real person.","على الإنترنت: توقف (لا ترد)، والتقط صورة للشاشة، وأرِها لشخص كبير. وقبل أن تنشر اسأل: هل هو صحيح؟ هل هو لطيف؟ هل هو ضروري؟ خلف كل شاشة إنسان حقيقي."),
 think:[S("Why can a mean message online feel even worse?","لماذا قد تكون الرسالة القاسية على الإنترنت أسوأ؟"),S("What are the 3 steps when you see bullying online?","ما الخطوات الثلاث عندما ترى تنمرًا على الإنترنت؟"),S("What 3 questions do you ask before you post?","ما الأسئلة الثلاثة التي تسألها قبل أن تنشر؟")],
 scenes:[
  {img:'s6-1',ph:'📱😂',t:S("Adam's class has a group chat. One day, someone posts a photo of Adam falling down in the playground. Many kids send 😂😂😂.","لفصل آدم مجموعة دردشة. وذات يوم نشر أحدهم صورة لآدم وهو يقع في الملعب، وأرسل كثير من الأطفال 😂😂😂."),
   choice:{q:S("How does Adam feel?","بماذا يشعر آدم؟"),opts:[
    {t:S("😳 Embarrassed and hurt","😳 محرَج ومجروح"),ok:1,fb:S("Yes. It hurts when people laugh at you, not with you.","صحيح. يؤلمنا أن يضحك الناس علينا، لا معنا.")},
    {t:S("😊 Happy — it's just a joke","😊 سعيد، إنها مجرد مزحة"),ok:0,fb:S("A joke is only funny if everyone laughs, including the person in it.","المزحة تكون مضحكة فقط إذا ضحك الجميع، ومنهم صاحب الصورة.")}]}},
  {img:'s6-1',ph:'⌨️😡',t:S("Adam wants to write mean words back. His fingers are on the keyboard…","يريد آدم أن يكتب ردًا قاسيًا. أصابعه على لوحة المفاتيح…"),
   choice:{q:S("What should Adam do?","ماذا يجب أن يفعل آدم؟"),opts:[
    {t:S("Write mean words back.","يكتب ردًا قاسيًا."),ok:0,fb:S("Mean replies make the fight bigger, and they stay online.","الردود القاسية تكبّر المشكلة، وتبقى على الإنترنت.")},
    {t:S("Don't reply. Take a screenshot and show a parent.","لا يرد. يلتقط صورة للشاشة ويُريها لأحد والديه."),ok:1,fb:S("Perfect! Stop, Screenshot, Show an adult.","ممتاز! توقف، والتقط صورة، وأرِها لشخص كبير.")},
    {t:S("Delete the app and tell nobody.","يحذف التطبيق ولا يخبر أحدًا."),ok:0,fb:S("Adam shouldn't carry this alone. Tell a trusted adult.","لا يجب أن يحمل آدم هذا وحده. أخبر شخصًا كبيرًا تثق به.")}]}},
  {img:'s6-2',ph:'👨‍👦📱',t:S("Adam shows Dad. Dad hugs him: <q>“Thank you for telling me. You did the right thing.”</q> Together they tell the teacher.","يُري آدم الرسائل لبابا. يحضنه بابا ويقول: <q>«شكرًا لأنك أخبرتني، لقد فعلت الصواب».</q> ثم يخبران المعلمة معًا.")},
  {img:'s6-4',ph:'👧💬',t:S("Lina is in the group too. She sees the photo and all the laughing faces.","لينا أيضًا في المجموعة. ترى الصورة وكل الوجوه الضاحكة."),
   choice:{q:S("What can Lina do?","ماذا تستطيع لينا أن تفعل؟"),opts:[
    {t:S("Send 😂 too, like everyone.","ترسل 😂 مثل الجميع."),ok:0,fb:S("Joining in makes Adam feel even worse.","المشاركة في الضحك تجعل آدم يشعر بالأسوأ.")},
    {t:S("Write “This isn't kind. Please delete it.” and send Adam a kind message.","تكتب «هذا ليس لطيفًا، احذفوها من فضلكم»، وترسل لآدم رسالة لطيفة."),ok:1,fb:S("Lina is an upstander online! 🦸","لينا ناصرة لغيرها على الإنترنت! 🦸")},
    {t:S("Ignore it.","تتجاهل الأمر."),ok:0,fb:S("Lina is safe, but Adam still feels alone. She can do more.","لينا في أمان، لكن آدم ما زال يشعر بالوحدة. تستطيع أن تفعل أكثر.")}]}},
  {img:'s6-3',ph:'🧑‍🏫💻',t:S("The photo is deleted. The teacher talks to the class: <q>“Behind every screen there is a real person with real feelings.”</q> Adam feels better because people helped him.","حُذفت الصورة. وتحدثت المعلمة مع الفصل: <q>«خلف كل شاشة إنسان حقيقي له مشاعر حقيقية».</q> شعر آدم بتحسن لأن هناك من ساعده.")}
 ]}
];

let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1400);}
function addStar(n=1){stars+=n;save();const s=$('stars');s.textContent='⭐ '+stars;s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');toast('+'+n+' ⭐');}
function once(key,n=1){if(awarded[key])return;awarded[key]=1;addStar(n);}
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/[“”«»"]/g,'');}
let _utt=null;
function pickVoice(lg){
  try{
    const vs=speechSynthesis.getVoices()||[];
    const pref=lg==='ar'?/^ar[-_](EG|SA)/i:/^en[-_](US|GB)/i, any=lg==='ar'?/^ar/i:/^en/i;
    return {all:vs.length,v:vs.find(v=>pref.test(v.lang))||vs.find(v=>any.test(v.lang))||null};
  }catch(e){return {all:0,v:null};}
}
function speak(text,lg){
  lg=lg||lang;
  if(!window.speechSynthesis||typeof SpeechSynthesisUtterance==='undefined'){
    toast(L(S('🔇 This browser has no voice. Open the link in Chrome or Safari.','🔇 هذا المتصفح لا يدعم الصوت. افتح الرابط في Chrome أو Safari.')));return;}
  try{
    speechSynthesis.cancel();
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(text);
      const {all,v}=pickVoice(lg);
      u.lang=lg==='ar'?'ar-EG':'en-US';
      if(v){u.voice=v;u.lang=v.lang;}
      u.rate=lg==='ar'?0.9:0.85;u.volume=1;
      u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast(L(S('🔇 Sound problem — open 🔊 Sound test on the home page','🔇 مشكلة في الصوت، افتح «🔊 تجربة الصوت» من الصفحة الرئيسية')));};
      _utt=u;
      try{speechSynthesis.resume();}catch(e){}
      speechSynthesis.speak(u);
      if(all&&!v)toast(lg==='ar'?L(S('🔇 No Arabic voice on this phone. Tap English to listen in English, or see 🔊 Sound test.','🔇 لا يوجد صوت عربي على الهاتف. اضغط English لتسمع بالإنجليزية، أو افتح «🔊 تجربة الصوت».')):L(T.noVoice));
    },120);
  }catch(e){toast(L(T.noVoice));}
}
try{speechSynthesis.getVoices();speechSynthesis.addEventListener('voiceschanged',()=>{if((location.hash||'')==='#sound')vSound();});}catch(e){}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function memoryGame(){
  const keys=shuffle(['happy','sad','angry','scared','embarrassed','proud','nervous','lonely','shy','surprised']).slice(0,6);
  const cards=shuffle(keys.flatMap(k=>[{k,type:'e'},{k,type:'w'}]));
  let open=[],matched=0,moves=0,lock=false;const tok=viewTok;
  const draw=()=>{
    if(tok!==viewTok||!$('gc'))return;
    $('gc').innerHTML=`<div class="g-count">${L(T.moves)}: ${moves}</div><div class="mem">${cards.map((c,i)=>`<button class="mcard ${c.m?'match':c.o?'open':''}" data-i="${i}">${c.m||c.o?(c.type==='e'?`<span class="big">${FEEL[c.k].e}</span>`:L(FEEL[c.k])):''}</button>`).join('')}</div>`;
    $('gc').querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{
      const c=cards[+b.dataset.i];if(lock||c.o||c.m)return;
      c.o=1;open.push(c);
      if(c.type==='w')speak(FEEL[c.k][lang]);
      if(open.length===2){
        moves++;lock=true;
        const [a,b2]=open;
        if(a.k===b2.k&&a.type!==b2.type){a.m=b2.m=1;matched++;open=[];lock=false;draw();
          if(matched===keys.length){once('mem',3);setTimeout(()=>gameResult('memory',keys.length,keys.length,0),700);}
        }else{draw();setTimeout(()=>{a.o=b2.o=0;open=[];lock=false;draw();},900);}
      }else draw();
    });
  };
  draw();
}

function saveEntry(){
  jd.what=$('jWhat').value.trim();

  journal.unshift({d:new Date().toISOString(),f:jd.f,lv:jd.lv,what:jd.what.slice(0,600),help:Object.keys(jd.help).filter(k=>jd.help[k])});

function delEntry(i,b){

function finishDone(id){
  if(!awarded['fin'+id]){awarded['fin'+id]=1;save();once('finst'+id,2);}
  if(FINISH.every(f=>awarded['fin'+f.id])&&earn('finish'))setTimeout(()=>toast(BADGES.finish.e+' '+L(T.newBadge)),1500);
}

function vParents(){
  app.innerHTML=head('👪',S("Parents' Corner","ركن الأهل"),S('How to protect your child and talk about bullying.','كيف تحمي طفلك وتتحدث معه عن التنمر.'))+
  PARENTS.map(p=>`<div class="card skill-card" style="margin-bottom:12px"><h3>${L(p.h)}</h3><ul>${p.s.map(x=>`<li>${L(x)}</li>`).join('')}</ul></div>`).join('');
}

/* =========================================================
   ROUTER
   ========================================================= */
let viewTok=0;
function route(keep){
  viewTok++;
  try{speechSynthesis.cancel();}catch(e){}
  if(breathTimer){clearTimeout(breathTimer);breathTimer=null;}
  setChrome();
  const h=(location.hash||'#home').slice(1);
  if(h.startsWith('story-')){vStory(+h.slice(6));return;}
  cur={s:null,i:0,ans:{}};
  if(h.startsWith('game-'))vGame(h.slice(5));
  else if(h.startsWith('tool-'))vTool(h.slice(5));
  else if(h==='stories')vStories();
  else if(h==='games')vGames();
  else if(h==='tools')vTools();
  else if(h==='badges')vBadges();
  else if(h==='book')vBook();
  else if(h==='journal')vJournal();
  else if(h==='parents')vParents();
  else if(h==='sound')vSound();
  else if(h.startsWith('finish-'))vFinish(+h.slice(7));
  else vHome();
  if(!keep)window.scrollTo({top:0});
}
/* if images were uploaded without the img/ folder, look for them next to index.html */
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&!t.dataset.f&&/\/img\/[^/]+\.jpg/.test(t.src)){t.dataset.f=1;t.src=t.src.replace(/\/img\/([^/]+\.jpg)/,'/$1');}},true);
window.addEventListener('hashchange',()=>route());
route();
</script>
